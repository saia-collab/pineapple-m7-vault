<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F7F5EF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-frame-01-hook"
        class="scene"
        data-composition-id="frame-01-hook"
        data-composition-src="compositions/frames/frame-01-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-frame-02-bruise"
        class="scene"
        data-composition-id="frame-02-bruise"
        data-composition-src="compositions/frames/frame-02-bruise.html"
        data-start="4"
        data-duration="9"
        data-track-index="1"
      ></div>

      <div
        id="el-frame-03-goup"
        class="scene"
        data-composition-id="frame-03-goup"
        data-composition-src="compositions/frames/frame-03-goup.html"
        data-start="13"
        data-duration="12"
        data-track-index="1"
      ></div>

      <div
        id="el-frame-04-file"
        class="scene"
        data-composition-id="frame-04-file"
        data-composition-src="compositions/frames/frame-04-file.html"
        data-start="25"
        data-duration="12"
        data-track-index="1"
      ></div>

      <div
        id="el-frame-05-keep"
        class="scene"
        data-composition-id="frame-05-keep"
        data-composition-src="compositions/frames/frame-05-keep.html"
        data-start="37"
        data-duration="10"
        data-track-index="1"
      ></div>

      <div
        id="el-frame-06-cred"
        class="scene"
        data-composition-id="frame-06-cred"
        data-composition-src="compositions/frames/frame-06-cred.html"
        data-start="47"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-frame-07-cta"
        class="scene"
        data-composition-id="frame-07-cta"
        data-composition-src="compositions/frames/frame-07-cta.html"
        data-start="55"
        data-duration="5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
